<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gloamreach — Balancing Dashboard</title>
    <style>
      :root {
        --bg: #131019;
        --panel: #1b1726;
        --panel2: #241f33;
        --line: #322a44;
        --text: #d9d3e6;
        --dim: #948aa8;
        --accent: #b57ce6;
        --accent2: #7c9ee8;
        --good: #5ad06a;
        --bad: #e05a5a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      a { color: var(--accent2); }
      #layout { display: flex; min-height: 100vh; }
      /* Sidebar */
      nav {
        width: 210px;
        flex: 0 0 210px;
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 16px 0;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }
      nav h1 {
        font-size: 15px;
        margin: 0 16px 4px;
        color: var(--accent);
        letter-spacing: 0.5px;
      }
      nav .sub { font-size: 11px; color: var(--dim); margin: 0 16px 16px; }
      nav button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--dim);
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
        border-left: 3px solid transparent;
      }
      nav button:hover { color: var(--text); background: var(--panel2); }
      nav button.active {
        color: var(--accent);
        border-left-color: var(--accent);
        background: var(--panel2);
      }
      /* Main */
      main { flex: 1; padding: 28px 34px; max-width: 1200px; }
      section { display: none; }
      section.active { display: block; }
      h2 {
        font-size: 22px;
        margin: 0 0 4px;
        color: var(--text);
      }
      .note {
        color: var(--dim);
        font-size: 12.5px;
        margin: 0 0 20px;
        max-width: 780px;
      }
      .note code {
        background: var(--panel2);
        padding: 1px 5px;
        border-radius: 3px;
        font-size: 12px;
      }
      h3 {
        font-size: 15px;
        margin: 26px 0 10px;
        color: var(--accent);
        border-bottom: 1px solid var(--line);
        padding-bottom: 6px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 12px;
        font-size: 13px;
      }
      th, td {
        text-align: left;
        padding: 7px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      th {
        color: var(--dim);
        font-weight: 600;
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        position: sticky;
        top: 0;
        background: var(--bg);
      }
      tr:hover td { background: var(--panel); }
      td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
      .tag {
        display: inline-block;
        padding: 1px 7px;
        border-radius: 10px;
        font-size: 11px;
        background: var(--panel2);
        color: var(--dim);
        border: 1px solid var(--line);
      }
      .tier1 { color: var(--accent); border-color: var(--accent); }
      .muted { color: var(--dim); }
      .cost { color: var(--text); }
      .pos { color: var(--good); }
      .neg { color: var(--bad); }
      .dot {
        display: inline-block;
        width: 9px; height: 9px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: middle;
      }
      .searchwrap { margin: 0 0 8px; }
      input[type="search"] {
        background: var(--panel2);
        border: 1px solid var(--line);
        color: var(--text);
        padding: 7px 11px;
        border-radius: 6px;
        width: 260px;
        font-size: 13px;
      }
      .legend { font-size: 12px; color: var(--dim); margin: 4px 0 14px; }
      .cardrow { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 16px;
        min-width: 150px;
      }
      .card .big { font-size: 22px; font-weight: 700; color: var(--accent); }
      .card .lbl { font-size: 11.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.4px; }
    </style>
  </head>
  <body>
    <div id="layout">
      <nav id="nav">
        <h1>⚔ Gloamreach</h1>
        <div class="sub">Balancing Dashboard</div>
      </nav>
      <main id="app"></main>
    </div>
    <script type="module" src="/src/dashboard/main.ts"></script>
  </body>
</html>
